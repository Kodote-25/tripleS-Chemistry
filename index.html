<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>트리플에스 케미명</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2 class="page-title">트리플에스 케미명</h2>
  <div class="table-container">
    <table id="chemistryTable" aria-label="트리플에스 멤버 케미명 표"></table>
  </div>

  <div id="chemistryModal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="chemistryTitle">
      <button class="close" type="button" aria-label="닫기">&times;</button>
      <h2 id="chemistryTitle"></h2>
      <img id="chemistryImage" src="" alt="케미 이미지">
      <p id="chemistryDescription"></p>
      <div id="chemistryLinks"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
